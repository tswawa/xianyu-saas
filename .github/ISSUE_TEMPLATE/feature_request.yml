name: Feature request
description: 提议可验证的新能力
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认提议符合账号隔离、真实业务状态和平台合规边界。
        不要提交 Cookie、Token、API Key、真实订单、买家信息、库存或生产日志。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 用用户目标和当前限制描述，不要只描述界面按钮。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明数据来源、权限、失败路径、恢复方式和对六个业务域的影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 我没有包含真实凭据或用户业务数据。
          required: true
        - label: 我理解真实闲鱼和真实订单验收需要受控窗口，不能在公开 Issue 中盲测。
          required: true
