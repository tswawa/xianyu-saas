name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  standalone:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            architecture: x86_64
            runner: ubuntu-24.04
            manager_platform: linux/amd64
          - target: linux-aarch64
            architecture: aarch64
            runner: ubuntu-24.04-arm
            manager_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify native build architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python - <<'PY'
          import os
          import platform
          aliases = {"amd64": "x86_64", "x64": "x86_64", "arm64": "aarch64"}
          actual = aliases.get(platform.machine().strip().lower(), platform.machine().strip().lower())
          if actual != os.environ["EXPECTED_ARCHITECTURE"]:
              raise SystemExit(f"native architecture mismatch: {actual}")
          PY
      - name: Build bootstrap manager on Debian 12
        env:
          TARGET: ${{ matrix.target }}
          MANAGER_PLATFORM: ${{ matrix.manager_platform }}
          MANAGER_BUILD_IMAGE: python:3.12.14-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
        run: |
          mkdir -p ".local/manager/$TARGET" ".local/standalone/$TARGET"
          docker run --rm --platform "$MANAGER_PLATFORM" \
            --env TARGET \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$MANAGER_BUILD_IMAGE" \
            /bin/sh -eu -c '
              apt-get update
              apt-get install --yes --no-install-recommends binutils
              python -m pip install --no-cache-dir "pyinstaller==6.16.0" -r backend/requirements.txt
              python -m PyInstaller --clean --noconfirm \
                --distpath ".local/manager/$TARGET/dist" \
                --workpath ".local/manager/$TARGET/work" \
                deploy/manager/xianyu-saas-manager.spec
              install -Dm755 ".local/manager/$TARGET/dist/xianyu-saas" ".local/standalone/$TARGET/manager"
              ".local/standalone/$TARGET/manager" internal self-check > /tmp/manager-self-check.json
            '
          sudo chown -R "$(id -u):$(id -g)" ".local/manager/$TARGET" ".local/standalone/$TARGET"
      - name: Download exact locked wheels
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          WHEELHOUSE: .local/wheelhouse/${{ matrix.target }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          architecture = os.environ["ARCHITECTURE"]
          wheelhouse = Path(os.environ["WHEELHOUSE"])
          wheelhouse.mkdir(parents=True, exist_ok=True)
          selected = {}
          for service in ("backend", "worker"):
              lock = json.loads(Path(f"deploy/runtime/{service}.lock.json").read_text(encoding="utf-8"))
              if lock.get("status") != "locked":
                  raise SystemExit("standalone_dependency_lock_incomplete")
              if lock.get("schema") != 1 or lock.get("kind") != "python-wheel-lock" or lock.get("service") != service:
                  raise SystemExit("standalone_dependency_lock_invalid")
              for package in lock.get("packages", []):
                  candidates = [item for item in package.get("artifacts", []) if architecture in item.get("architectures", []) or "any" in item.get("architectures", [])]
                  if len(candidates) != 1:
                      raise SystemExit("standalone_dependency_artifact_missing")
                  item = candidates[0]
                  filename = item.get("filename")
                  url = item.get("url")
                  parsed = urllib.parse.urlparse(url) if isinstance(url, str) else None
                  if (not isinstance(filename, str) or Path(filename).name != filename or parsed is None
                          or parsed.scheme != "https" or parsed.hostname != "files.pythonhosted.org"
                          or urllib.parse.unquote(Path(parsed.path).name) != filename):
                      raise SystemExit("standalone_dependency_lock_invalid")
                  identity = (item.get("size"), item.get("sha256"), url)
                  if filename in selected and selected[filename] != identity:
                      raise SystemExit("standalone_dependency_lock_invalid")
                  selected[filename] = identity
          for filename, (size, expected, url) in sorted(selected.items()):
              if not isinstance(size, int) or size <= 0 or not isinstance(expected, str) or len(expected) != 64:
                  raise SystemExit("standalone_dependency_lock_invalid")
              destination = wheelhouse / filename
              digest = hashlib.sha256()
              total = 0
              request = urllib.request.Request(url, headers={"User-Agent": "xianyu-saas-release/1"})
              with urllib.request.urlopen(request, timeout=60) as response, destination.open("xb") as output:
                  while block := response.read(1024 * 1024):
                      total += len(block)
                      if total > size:
                          raise SystemExit("standalone_dependency_hash_mismatch")
                      digest.update(block)
                      output.write(block)
              if total != size or digest.hexdigest() != expected:
                  raise SystemExit("standalone_dependency_hash_mismatch")
          PY
      - name: Build standalone runtime bundle
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/build-standalone.py \
            --commit "$GITHUB_SHA" \
            --architecture "$ARCHITECTURE" \
            --wheelhouse ".local/wheelhouse/$TARGET" \
            --manager-binary ".local/standalone/$TARGET/manager" \
            --output ".local/standalone/$TARGET/bundle"
      - name: Smoke test standalone runtime and manager
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TARGET: ${{ matrix.target }}
        run: |
          root=".local/standalone/$TARGET/bundle"
          PYTHONPATH="$root/runtime/site/backend" "$root/runtime/python/bin/python3" -m pip check
          PYTHONPATH="$root/runtime/site/worker" "$root/runtime/python/bin/python3" -m pip check
          PYTHONPATH="$root/runtime/site/backend" "$root/runtime/python/bin/python3" -c "import fastapi,uvicorn,requests,cryptography"
          PYTHONPATH="$root/runtime/site/worker" "$root/runtime/python/bin/python3" -c "import openai,websockets,loguru,dotenv,requests"
          "$root/manager/xianyu-saas" internal self-check
          ldd "$root/manager/xianyu-saas" | tee ".local/manager/$TARGET/ldd.txt"
          if grep -F "not found" ".local/manager/$TARGET/ldd.txt"; then exit 1; fi
      - name: Pack unsigned standalone handoff
        env:
          TARGET: ${{ matrix.target }}
        run: |
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
            -C ".local/standalone/$TARGET" -cf ".local/standalone-$TARGET.tar" bundle manager
      - name: Upload unsigned standalone handoff
        uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ matrix.target }}
          path: .local/standalone-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [validate, standalone]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Verify release version
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          version = json.loads(Path("package.json").read_text())["version"]
          match = re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?", version)
          if not match or len(version) > 128 or any(part.isdigit() and len(part) > 1 and part[0] == "0" for part in (match.group(4) or "").split(".")):
              raise SystemExit("Invalid release version")
          if os.environ["RELEASE_TAG"] != "v" + version:
              raise SystemExit("Tag and package version differ")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("version=" + version + "\n")
          PY
      - name: Install release verification dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Download x86_64 standalone handoff
        uses: actions/download-artifact@v4
        with:
          name: standalone-linux-x86_64
          path: .local/downloads/linux-x86_64
      - name: Download aarch64 standalone handoff
        uses: actions/download-artifact@v4
        with:
          name: standalone-linux-aarch64
          path: .local/downloads/linux-aarch64
      - name: Extract unsigned standalone handoffs
        run: |
          for target in linux-x86_64 linux-aarch64; do
            mkdir -p ".local/standalone-inputs/$target"
            tar -xf ".local/downloads/$target/standalone-$target.tar" -C ".local/standalone-inputs/$target"
          done
      - name: Verify release contracts
        run: |
          python -B tests/docker-update-protocol-contract.py
          python -B tests/standalone-build-contract.py
          python -B tests/release-bundle-contract.py
      - name: Build and sign complete release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python scripts/build-release.py \
            --ref "$RELEASE_COMMIT" \
            --standalone-input-root .local/standalone-inputs \
            --output ".local/releases/$RELEASE_VERSION" \
            --notes-output ".local/releases/$RELEASE_VERSION-release-notes.md"
      - name: Validate complete signed release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python -B scripts/verify-public-release.py \
            --directory ".local/releases/$RELEASE_VERSION" \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --public-key deploy/update-signing.pub
      - name: Retain validated release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: .local/releases/${{ steps.metadata.outputs.version }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload draft, verify remote assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          dir=".local/releases/$RELEASE_VERSION"
          notes_file=".local/releases/$RELEASE_VERSION-release-notes.md"
          test -s "$notes_file"
          assets=("$dir"/*)
          test "${#assets[@]}" -eq 14
          for asset in "${assets[@]}"; do test -s "$asset"; done
          prerelease=(--prerelease=false)
          latest=(--latest)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=(--prerelease)
            latest=(--latest=false)
          fi
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to replace an already published release" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$RELEASE_TAG" --notes-file "$notes_file" "${prerelease[@]}"
          fi
          remote="$RUNNER_TEMP/verified-release"
          mkdir "$remote"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote"
          python -B scripts/verify-public-release.py \
            --directory "$remote" \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --public-key deploy/update-signing.pub
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${prerelease[@]}" "${latest[@]}"
