# Load in nginx's http context before xianyu-saas.locations.conf.
limit_req_zone $binary_remote_addr zone=xianyu_connector_submit:1m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=xianyu_connector_conn:1m;
limit_req_zone $binary_remote_addr zone=xianyu_login_poll:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=xianyu_login_complete:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=xianyu_login_conn:1m;
