# Include these locations inside your HTTPS server block.

location = /xianyu-saas {
    return 308 /xianyu-saas/;
}

location = /xianyu-saas/api/auth/login {
    limit_req zone=xianyu_session burst=10 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8096/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
}

location = /xianyu-saas/api/auth/register {
    limit_req zone=xianyu_session burst=10 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8096/api/auth/register;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
}

location = /xianyu-saas/api/auth/bootstrap {
    limit_req zone=xianyu_auth_bootstrap burst=2 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 32k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8096/api/auth/bootstrap;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 30s;
}

location = /xianyu-saas/api/admin/confirm {
    limit_req zone=xianyu_admin_confirm burst=3 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 8k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8096/api/admin/confirm;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 30s;
}

# Update-status polling. The real backend route is GET /api/admin/updates
# (no trailing slash); both URL forms are proxied straight there so a status
# read is never redirected into the POST-only update block. Deliberately not
# added to the xianyu_platform_update zone so polling cannot consume the 12r/m
# write limit. Sub-paths under /updates/ keep their POST-only restriction.
location = /xianyu-saas/api/admin/updates {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8096/api/admin/updates;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 30s;
}

location = /xianyu-saas/api/admin/updates/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8096/api/admin/updates;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 30s;
}

location ^~ /xianyu-saas/api/admin/updates/ {
    limit_req zone=xianyu_platform_update burst=4 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 8k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8096/api/admin/updates/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 10m;
}

location = /xianyu-saas/api/bot/login/start {
    limit_req zone=xianyu_session burst=5 nodelay;
    limit_conn xianyu_login_conn 2;
    limit_conn_status 429;
    limit_except POST { deny all; }
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8096/api/bot/login/start;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 20s;
}

location = /xianyu-saas/api/bot/login/complete {
    limit_req zone=xianyu_login_complete burst=2 nodelay;
    limit_conn xianyu_login_conn 2;
    limit_conn_status 429;
    limit_except POST { deny all; }
    client_max_body_size 1k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8096/api/bot/login/complete;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 70s;
}

location ^~ /xianyu-saas/api/bot/login/ {
    limit_req zone=xianyu_login_poll burst=8 nodelay;
    limit_conn xianyu_login_conn 3;
    limit_conn_status 429;
    limit_except GET POST { deny all; }
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8096/api/bot/login/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 30s;
}

location ^~ /xianyu-saas/api/ {
    limit_except GET POST PUT PATCH DELETE { deny all; }
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:8096/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 70s;
}

# 前端由控制面按当前应用目录（内置文件更新后的 code-store/current）提供，
# nginx 只做代理，不直接读取 0700 的可写代码存储。
location = /xianyu-saas/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:8096/xianyu-saas/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
}

location ^~ /xianyu-saas/assets/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:8096/xianyu-saas/assets/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
}

# Reject /xianyu-saas/internal/* and every other non-public frontend path.
location ^~ /xianyu-saas/ {
    return 404;
}
