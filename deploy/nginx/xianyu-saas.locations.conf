# Include these locations inside the deepwhale.chat TLS server block.

location = /xianyu-saas {
    return 308 /xianyu-saas/;
}

location = /xianyu-saas/api/auth/login {
    limit_req zone=deepwhale_session burst=10 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8096/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
}

location = /xianyu-saas/api/auth/register {
    limit_req zone=deepwhale_session burst=10 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8096/api/auth/register;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
}

location = /xianyu-saas/api/bot/login/start {
    limit_req zone=deepwhale_session burst=5 nodelay;
    limit_conn xianyu_login_conn 2;
    limit_conn_status 429;
    limit_except POST { deny all; }
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8096/api/bot/login/start;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 20s;
}

location = /xianyu-saas/api/bot/login/complete {
    limit_req zone=xianyu_login_complete burst=2 nodelay;
    limit_conn xianyu_login_conn 2;
    limit_conn_status 429;
    limit_except POST { deny all; }
    client_max_body_size 1k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8096/api/bot/login/complete;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 70s;
}

location ^~ /xianyu-saas/api/bot/login/ {
    limit_req zone=xianyu_login_poll burst=8 nodelay;
    limit_conn xianyu_login_conn 3;
    limit_conn_status 429;
    limit_except GET POST { deny all; }
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8096/api/bot/login/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 30s;
}

location = /xianyu-saas/api/bot/connector/cookies {
    limit_req zone=xianyu_connector_submit burst=4 nodelay;
    limit_conn xianyu_connector_conn 2;
    limit_conn_status 429;
    limit_except POST { deny all; }
    client_max_body_size 40k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8096/api/bot/connector/cookies;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 70s;
}

location ^~ /xianyu-saas/api/ {
    limit_except GET POST PUT PATCH DELETE { deny all; }
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:8096/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_read_timeout 70s;
}

location = /xianyu-saas/ {
    limit_except GET HEAD { deny all; }
    alias /var/www/xianyu-saas-ui/index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

location ^~ /xianyu-saas/assets/ {
    limit_except GET HEAD { deny all; }
    alias /var/www/xianyu-saas-ui/assets/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Reject /xianyu-saas/internal/* and every other non-public frontend path.
location ^~ /xianyu-saas/ {
    return 404;
}
