services:
  xianyu-saas:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SAAS_BUILD_COMMIT: ${SAAS_BUILD_COMMIT:-}
        SAAS_BUILD_DIRTY: ${SAAS_BUILD_DIRTY:-unknown}
    image: xianyu-saas:local
    container_name: xianyu-saas
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
      - "127.0.0.1:8096:8096"
    env_file:
      # 默认使用 config/saas.env；deploy/docker-install.sh 会用绝对路径导出
      # SAAS_ENV_FILE，使 --env-file 同时作用于 Compose 插值与容器 env_file。
      - ${SAAS_ENV_FILE:-config/saas.env}
    environment:
      SAAS_DB: /data/saas.db
      SAAS_TENANTS_DIR: /data/tenants
      SAAS_BOT_ROOT: /app/worker
      # 可写的内置文件更新代码存储；业务数据仍由 ./data 挂载持久化。
      SAAS_APP_CODE_DIR: /data/app-code
    volumes:
      - ./data:/data
    # 控制面派生 Worker 时用 RLIMIT_AS 限制内存，需要允许进程自设资源上限。
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    security_opt:
      - no-new-privileges:true
